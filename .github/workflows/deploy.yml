name: Deploy to Hostinger (FTPS)

# Publishes the site to justlab.com.br (public_html) over FTPS.
#
# Run it by hand from the Actions tab (workflow_dispatch). After the first
# successful cutover run, the `push` trigger below can be switched on so every
# merge to main goes live automatically.
#
# Requires repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Before the FIRST run, back up and empty the old WordPress files in public_html
# (an index.php there would be served instead of index.html).

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: "Remote directory under the FTP account (keep the trailing slash)"
        required: true
        default: "public_html/"
  # push:
  #   branches: [main]

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ github.event.inputs.target_dir || 'public_html/' }}
          # never delete files on the server that are not part of the build
          dangerous-clean-slate: false
