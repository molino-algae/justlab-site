name: JUST Lab
# JUST = "JustLab Unlocks Sustainable Technologies" — the open padlock in the
# logo means "unlocks"; the leaf means sustainability.
acronym: JustLab Unlocks Sustainable Technologies
tagline: from gene to bioprocess
